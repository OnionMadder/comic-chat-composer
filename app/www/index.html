<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>mComic '96</title>
<style>
  :root{
    --void:#08080b; --cyan:#2cffe6; --pink:#ff3d9a; --lime:#b6ff3d; --text:#f2f0ff; --muted:#8b87a6;
    --comic:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--void);
    background-image:radial-gradient(rgba(44,255,230,.06) 1px,transparent 1.5px);
    background-size:26px 26px;
    color:var(--text); font-family:var(--comic);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; text-align:center; padding:24px;
    -webkit-user-select:none; user-select:none;
  }
  .tile{
    width:132px; height:132px; border-radius:30px; overflow:hidden;
    border:2px solid rgba(44,255,230,.55);
    box-shadow:0 0 26px rgba(44,255,230,.3);
  }
  .tile svg{display:block; width:100%; height:100%}
  h1{
    margin:0; font-size:44px; font-weight:700; line-height:1;
    text-shadow:0 0 18px rgba(242,240,255,.2);
  }
  h1 .m{color:var(--pink); text-shadow:0 0 16px rgba(255,61,154,.7)}
  h1 .c{color:var(--cyan); text-shadow:0 0 16px rgba(44,255,230,.55)}
  h1 .yr{
    font-size:.42em; vertical-align:.55em; margin-left:.12em; display:inline-block;
    transform:rotate(-4deg); color:var(--void); background:var(--lime);
    padding:.05em .3em; border-radius:8px; box-shadow:0 0 16px rgba(182,255,61,.55);
  }
  p{margin:0; color:var(--muted); font-size:15px}
  .boot{display:flex; gap:7px; align-items:center; color:var(--cyan); font-size:14px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:blink 1s infinite}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.dot{animation:none;opacity:.7}}
</style>
</head>
<body>
  <div class="tile">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="ng" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2cffe6" flood-opacity="0.9"/></filter>
        <filter id="np" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff3d9a" flood-opacity="0.9"/></filter>
      </defs>
      <rect width="512" height="512" fill="#0a0a12"/>
      <g filter="url(#np)"><rect x="252" y="86" width="192" height="122" rx="40" fill="#12030a" stroke="#ff3d9a" stroke-width="12"/><path d="M300 194 L288 246 L346 198 Z" fill="#12030a" stroke="#ff3d9a" stroke-width="12" stroke-linejoin="round"/></g>
      <g filter="url(#ng)"><rect x="60" y="178" width="270" height="160" rx="50" fill="#04100f" stroke="#2cffe6" stroke-width="15"/><path d="M150 330 L120 402 L214 332 Z" fill="#04100f" stroke="#2cffe6" stroke-width="15" stroke-linejoin="round"/><circle cx="132" cy="258" r="14" fill="#2cffe6"/><circle cx="196" cy="258" r="14" fill="#2cffe6"/><circle cx="260" cy="258" r="14" fill="#2cffe6"/></g>
      <g transform="translate(400,98) rotate(13)"><path d="M0 -52 L12 -21 L45 -33 L27 -5 L52 15 L19 17 L25 50 L0 29 L-25 50 L-19 17 L-52 15 L-27 -5 L-45 -33 L-12 -21 Z" fill="#b6ff3d" stroke="#0a0a12" stroke-width="5" stroke-linejoin="round"/><text x="0" y="9" text-anchor="middle" font-family="'Comic Sans MS',cursive" font-weight="700" font-size="27" fill="#0a0a12">'96</text></g>
    </svg>
  </div>
  <h1><span class="m">m</span><span class="c">Comic</span><span class="yr">'96</span></h1>
  <p>Type a conversation. Get a comic.</p>
  <div class="boot"><span class="dot"></span><span class="dot"></span><span class="dot"></span> booting the funnies</div>
</body>
</html>
